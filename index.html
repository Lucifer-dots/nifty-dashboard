<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="NIFTY / SENSEX / Gold analytics dashboard. Educational only. Not investment advice.">
<title>RA Market Pulse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icon.svg">
<link rel="stylesheet" href="static/style.css?v=5">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span><span>RA PULSE</span></div>
  <div id="hdr-nifty" class="hdr-nifty"></div>
  <div id="mstatus" class="snap">…</div>
</header>
<nav id="tabs" aria-label="Sections">
  <button data-tab="pretrade" class="active"><i>✓</i><span>Pre-Trade</span></button>
  <button data-tab="flow"><i>⇅</i><span>Flow</span></button>
  <button data-tab="options"><i>◎</i><span>Options</span></button>
  <button data-tab="setups"><i>⚡</i><span>Setups</span></button>
  <button data-tab="calm"><i>≈</i><span>Calm</span></button>
  <button data-tab="screener"><i>☰</i><span>Screener</span></button>
  <button data-tab="global"><i>◆</i><span>Gold/BTC</span></button>
</nav>
<main id="main">
  <section id="tab-pretrade" class="tab active"></section>
  <section id="tab-flow" class="tab"></section>
  <section id="tab-options" class="tab"></section>
  <section id="tab-setups" class="tab"></section>
  <section id="tab-calm" class="tab"></section>
  <section id="tab-screener" class="tab"></section>
  <section id="tab-global" class="tab"></section>
  <p class="disclaimer"><b>Educational only. Not investment advice.</b> No orders are placed from this app. Data: NSE public site and Yahoo Finance; may be delayed. <span id="updated"></span></p>
</main>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-box">
    <div class="sheet-head"><span id="sheet-title"></span><button id="sheet-close" aria-label="Close chart">✕</button></div>
    <div id="chart"></div>
    <div id="sheet-why"></div>
  </div>
</div>
<script src="static/vendor/lightweight-charts.js" defer></script>
<script src="static/app.js?v=5" defer></script>
</body>
</html>
