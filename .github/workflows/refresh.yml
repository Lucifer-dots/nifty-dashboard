name: refresh-data
# Publishes a fresh JSON snapshot to the `data` branch. The GitHub Pages site reads it.
# Times are UTC: IST = UTC + 5:30. Weekdays only.
on:
  schedule:
    - cron: '30-55/5 3 * * 1-5'   # 09:00-09:25 IST
    - cron: '*/5 4-9 * * 1-5'      # 09:30-15:25 IST
    - cron: '0-15/5 10 * * 1-5'    # 15:30-15:45 IST
    - cron: '30 11 * * 1-5'        # 17:00 IST closing snapshot
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/build_static.py out
      - name: Publish to data branch (single orphan commit, so history does not grow)
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data snapshot $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
